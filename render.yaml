services:
  - type: web
    name: realtimestocks-api
    env: python
    rootDir: server
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        value: https://realtimestocks-frontend.onrender.com

  - type: web
    name: realtimestocks-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://realtimestocks-api.onrender.com
      - key: VITE_WS_URL
        value: wss://realtimestocks-api.onrender.com/ws/stocks
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
